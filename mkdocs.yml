site_name: S1 Active Modding — Just-Nova23
site_description: Open research and tools for Xiaomi Watch S1 Active M2116W1
site_author: Just-Nova23
site_url: https://just-nova23.github.io/Xiaomi-Watch-S1-Active-Modding/
repo_name: Just-Nova23/Xiaomi-Watch-S1-Active-Modding
repo_url: https://github.com/Just-Nova23/Xiaomi-Watch-S1-Active-Modding
edit_uri: edit/main/docs/
copyright: Independent documentation by Just-Nova23 — code licensed under MIT

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site-controls.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
      url_download: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start:
      - Overview: index.md
      - Continuous guide: continuous-guide.md
      - Learning path: learning-path.md
      - Windows and Linux setup: windows-setup.md
      - Getting started: getting-started.md
      - Research status: status.md
      - FAQ: faq.md
  - How it works:
      - Architecture: architecture.md
      - Verified concept maps: concept-maps.md
      - Firmware packages: firmware-package-format.md
      - Native apps: native-apps.md
      - RPK apps: rpk-apps.md
      - Native assistant: native-assistant.md
      - Graphics and TSCFrameImage: graphics-tscframeimage.md
  - Step-by-step tutorials:
      - Inspect a full package: full-package-walkthrough.md
      - Compare firmware versions: firmware-comparison.md
      - Ghidra and ARM Thumb: ghidra-workflow.md
      - Assistant capacity patch: assistant-patch-walkthrough.md
      - Native GUI asset lab: gui-asset-lab.md
      - Build an RPK from zero: rpk-tutorial.md
  - Laboratory:
      - Research data and charts: research-data.md
      - Tool reference: tools-reference.md
      - ARM reverse engineering: reverse-engineering-arm.md
      - Patch development: patch-development.md
      - Research method: research-methodology.md
      - Lab notebook: lab-notebook.md
  - Safety:
      - OTA safety: ota-safety.md
      - Recovery: recovery.md
      - Known errors: known-errors.md
  - Community:
      - Contributing research: contributing-research.md
      - Roadmap: roadmap.md
      - Resource library: references.md
      - Glossary: glossary.md
